[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bosskey-stock"
version = "0.5.0"
description = "终端摸鱼盯盘工具 — 按一下 b 键，行情秒变 Docker 编译日志"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "bosskey-stock contributors"},
]
keywords = ["a-stock", "china-stock", "terminal", "tui", "boss-key", "摸鱼"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "rich>=13.0",
    "tomlkit>=0.12",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Angryshark128/bosskey-stock"
Repository = "https://github.com/Angryshark128/bosskey-stock"

[project.scripts]
bosskey = "bosskey_stock.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["bosskey_stock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
