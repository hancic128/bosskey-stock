name: CI

# 仅手动触发（Actions 额度纪律：禁止 push / PR 自动跑，见 Trilium《部署规范》）。
# 发布走 publish.yml（release published 触发，release 为手动创建的动作）。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: |
          ruff check bosskey_stock/
      - name: Test with pytest
        run: |
          pytest -v
